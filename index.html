function cEval(e){var t=e.match(/-?(?:\d+\.?\d*|\.\d+)|[+−×÷]/g)||[];while(t.length&&/[+−×÷]/.test(t[t.length-1]))t.pop();if(!t.length)return 0;var a=[+t[0]],o=[];for(var i=1;i<t.length;i+=2){var op=t[i],v=+t[i+1];if(op=='×')a[a.length-1]*=v;else if(op=='÷')a[a.length-1]=v?a[a.length-1]/v:0;else{o.push(op);a.push(v)}}var r=a[0];o.forEach(function(op,i){r=op=='+'?r+a[i+1]:r-a[i+1]});return r}

function todos(){return '<div class="card" style="padding:6px 16px 14px">'+(S.todos.length?S.todos.map(function(i){return sw(i.id,'t','<div class="pi"><button class="ck'+(i.d?' on':'')+'" data-a="tog" aria-label="切換完成">'+ico('chk',14)+'</button><input class="pin" data-a="ren" value="'+esc(i.t)+'" aria-label="待辦內容"></div>',0,'sm')}).join(''):'<div class="m" style="text-align:center;padding:12px 0">還沒有待辦事項</div>')+'<div class="add"><input data-a="newtodo" placeholder="新增待辦事項" aria-label="新增待辦事項"><button data-a="addtodo" aria-label="新增">＋</button></div></div>'}
var V={
home:function(){return '<div class="hero" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:14px"><div><h1 style="margin:0;color:inherit">Seoul2026</h1><div style="font-size:13px;opacity:.9;margin-top:6px">2026.11.14-11.18</div></div><button class="tk" data-a="ticket" aria-label="樂天會員條碼">'+ico('ticket',22)+'</button></div><div class="sec"><span class="ic" style="background:#5F8F7E">'+ico('chk',18)+'</span>待辦清單</div>'+todos()+'<div id="calc">'+calcHTML()+'</div>'},
trip:function(){var d=S.td||DATES[0],A=S.items.filter(function(x){return dd(x)==d});return '<h1>行程</h1><div class="chips five">'+DATES.map(function(x){return '<button data-a="tdate" data-d="'+x+'"'+(x==d?' class="on"':'')+'>'+x+'</button>'}).join('')+'</div>'+(A.length?'<div class="grp" data-d="'+d+'">'+A.map(tcard).join('')+'<div class="m" style="text-align:center">長按 0.5 秒拖曳排序，左滑編輯或刪除</div></div>':empty('cal','這天還沒有行程','點選右下角「＋」新增行程小卡'))},
info:function(){var s=S.stay;function f(l,k,t){return '<div class="kv"><span>'+l+'</span><input type="'+(t||'text')+'" data-s="'+k+'" value="'+esc(s[k])+'" placeholder="尚未填寫" aria-label="'+l+'"></div>'}
return '<h1>資訊</h1><div class="sec" style="margin-top:0"><span class="ic" style="background:#7C8240">'+ico('plane',18)+'</span>航班資訊<span class="pill" style="margin-left:auto">托運15KG / 手提10KG</span></div>'+FL+'<div class="sec"><span class="ic" style="background:#5F8F7E">'+ico('bed',18)+'</span>住宿資訊</div>'+HOTELS.map(hotel).join('')},
bag:function(){var a=0,d=0;S.packs.forEach(function(p){p.items.forEach(function(i){a++;if(i.d)d++})});var pc=a?Math.round(d/a*100):0;
return '<h1>行李</h1><div class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="font-size:12px">'+d+'/'+a+'</b><b style="font-size:18px;color:var(--tea)">'+pc+'%</b></div><div class="bar"><i style="width:'+pc+'%"></i></div><div class="g2" style="margin-top:14px"><button type="button" class="btn ghost" style="height:34px;font-size:13px;padding:0 12px" data-a="selall">全選</button><button type="button" class="btn ghost" style="height:34px;font-size:13px;padding:0 12px;background:var(--line);color:var(--mut)" data-a="clrall">清除勾選</button></div></div>'+(S.packs.length?'':empty('bag','還沒有行李種類','新增種類後，就能加入要帶的物品'))+S.packs.map(function(p){var n=p.items.filter(function(i){return i.d}).length;return '<div class="card'+(p.c?' col':'')+'" data-p="'+p.id+'"><div class="row" style="margin-bottom:6px"><button class="ph" style="flex:1;width:auto;margin:0" data-a="editpack" aria-label="編輯行李種類"><b>'+esc(p.name)+'</b><span class="m">'+n+' / '+p.items.length+'</span></button><button class="x" data-a="packtog" aria-label="收合或展開" aria-expanded="'+!p.c+'"><span style="display:flex;transform:rotate('+(p.c?180:0)+'deg)">'+ico('chev',18)+'</span></button></div>'+p.items.map(function(i){return sw(i.id,'p','<div class="pi"><button class="ck'+(i.d?' on':'')+'" data-a="tog" aria-label="切換是否已準備">'+ico('chk',14)+'</button><input class="pin" data-a="ren" value="'+esc(i.t)+'" aria-label="項目名稱"></div>',0,'sm')}).join('')+'<div class="add"><input data-a="newitem" placeholder="新增子項目" aria-label="新增子項目"><button data-a="additem" aria-label="新增">＋</button></div></div>'}).join('')+'<button class="btn" style="width:100%" data-a="newpack">＋ 新增行李種類</button>'},
money:function(){var L=S.exp.filter(function(e){return (S.f=='All'||e.d==S.f)&&((S.ft=='公費')==(e.payer=='公費'))}).map(function(e,i){return[e,i]}).sort(function(a,b){return DATES.indexOf(a[0].d)-DATES.indexOf(b[0].d)||a[1]-b[1]}).map(function(x){return x[0]}),T=L.reduce(function(a,e){return a+e.p},0);
return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+seg()+'<label class="rate">1 TWD =<input type="number" step="any" min="0" inputmode="decimal" value="'+S.rate+'" data-a="rate" aria-label="匯率 KRW">KRW</label></div><div class="card"><div class="big-n" style="margin:6px 0 4px"><span class="m">總花費</span><b>₩ '+T.toLocaleString()+'</b><span class="m">≈NT$ '+(S.rate>0?Math.round(T/S.rate):0).toLocaleString()+'</span></div></div><div class="chips">'+['All'].concat(DATES).map(function(d){return '<button data-a="flt" data-d="'+d+'"'+(S.f==d?' class="on"':'')+'>'+d+'</button>'}).join('')+'</div>'+(L.length?L.map(function(e){return sw(e.id,'e','<div class="row"><span class="ic" style="background:'+COL[e.c]+'">'+ico(e.c)+'</span><div class="grow"><div class="t">'+esc(e.t)+'<span class="m" style="font-weight:400"> · '+e.d+'</span></div>'+(e.pay||e.payer?'<div class="m">'+[e.pay,e.payer].filter(Boolean).map(function(x){return esc(x)}).join(' | ')+'</div>':'')+'</div><b>₩ '+e.p.toLocaleString()+'</b></div>'+(e.note?'<div class="nbox">'+esc(e.note)+'</div>':''),1,'big')}).join(''):empty('coin','還沒有任何花費','點選右下角「＋」新增記帳小卡'))}};
var NAV=[['home','首頁','home'],['trip','行程','cal'],['info','資訊','info'],['bag','行李','bag'],['money','記帳','coin']];
function render(){$('#app').innerHTML=V[tab]();$('#nav').innerHTML=NAV.map(function(n){return '<button data-t="'+n[0]+'"'+(n[0]==tab?' class="on"':'')+'>'+ico(n[2])+n[1]+'</button>'}).join('');var f=$('#fab');f.innerHTML=ico('plus',26);f.style.display=tab=='trip'||tab=='money'?'flex':'none'}
function go(t){tab=t;render();scrollTo(0,0)}
/* sheets */
function fd(l,n,v,a){return '<label class="fd">'+l+'<input name="'+n+'" value="'+esc(v)+'" '+(a||'')+'></label>'}
function cats(c){return '<div class="m" style="margin-bottom:6px">種類</div><div class="cats">'+Object.keys(COL).map(function(k){return '<label class="cc"><input type="radio" name="c" value="'+k+'"'+(k==c?' checked':'')+'><span><b class="ic" style="background:'+COL[k]+'">'+ico(k,15)+'</b>'+k+'</span></label>'}).join('')+'</div>'}
function sheet(title,body,cb,del){var o=$('#ov');o.innerHTML='<div class="sheet" role="dialog" aria-label="'+title+'"><i class="grip"></i><div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">'+title+'</h2>'+(del?'<button type="button" class="x" data-a="close" aria-label="關閉">'+ico('x',22)+'</button>':'')+'</div><form>'+body+'<div class="btns">'+(del?'<button type="button" class="btn ghost" data-a="delpack" data-p="'+del+'" style="color:var(--red)">刪除</button>':'<button type="button" class="btn ghost" data-a="close">取消</button>')+'<button class="btn">儲存</button></div></form></div>';o.classList.add('on');var f=o.querySelector('form');f.onsubmit=function(e){e.preventDefault();cb(new FormData(f));shut()}}
function shut(){$('#ov').classList.remove('on');$('#ov').innerHTML=''}
function itinSheet(it){it=it||{c:'景點',d:S.td};sheet(it.id?'編輯行程小卡':'新增行程小卡','<div class="g2">'+fd('行程時間','time',it.time,'type="time"')+fd('路程時間','dur',it.dur,'placeholder="例如 15 分鐘"')+'</div><label class="fd dc">日期<select name="d">'+DATES.map(function(d){return '<option'+(d==dd(it)?' selected':'')+'>'+d+'</option>'}).join('')+'</select></label>'+fd('標題','t',it.t,'required placeholder="例如 景福宮"')+fd('地圖連結','map',it.map,'inputmode="url" placeholder="https://"')+cats(it.c)+fd('備註','note',it.note),function(f){var o={id:it.id||uid(),d:f.get('d'),time:f.get('time'),dur:f.get('dur').trim(),t:f.get('t').trim(),map:f.get('map').trim(),c:f.get('c'),note:f.get('note').trim()};if(it.id)S.items=S.items.map(function(x){return x.id==it.id?o:x});else S.items.push(o);S.td=o.d;save();render()})}
function expSheet(e){e=e||{c:'餐飲',d:S.f=='All'?DATES[0]:S.f};sheet(e.id?'編輯記帳小卡':'新增記帳小卡',fd('標題','t',e.t,'required placeholder="例如 午餐"')+'<div class="g2">'+fd('價格（₩）','p',e.p,'required type="number" min="0" inputmode="numeric"')+'<label class="fd">日期<select name="d">'+DATES.map(function(d){return '<option'+(d==e.d?' selected':'')+'>'+d+'</option>'}).join('')+'</select></label></div>'+cats(e.c)+pays(e.pay)+payer(e)+'<label class="fd">備註<textarea name="note" rows="3">'+esc(e.note)+'</textarea></label>',function(f){var o={id:e.id||uid(),t:f.get('t').trim(),p:Math.round(+f.get('p')||0),d:f.get('d'),c:f.get('c'),pay:f.get('pay'),payer:f.get('payer')||'',note:f.get('note').trim()};if(e.id)S.exp=S.exp.map(function(x){return x.id==e.id?o:x});else S.exp.push(o);S.ft=o.payer=='公費'?'公費':'個人';save();render()})}
function find(k,id){var a=k=='i'?S.items:k=='e'?S.exp:null;if(a)return a.filter(function(x){return x.id==id})[0];return null}
/* clicks */
document.addEventListener('click',function(e){var t=e.target.closest('[data-t]');if(t)return go(t.dataset.t);var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,s=b.closest('.sw'),k=s&&s.dataset.k,id=s&&s.dataset.id;
if(a=='ticket')return ticket();
if(a=='zoom')return zoomCard();
if(a=='zmclose'){var z=$('#zm');if(z)z.remove();return}
if(a=='packtog'){var tp=b.closest('[data-p]').dataset.p;S.packs.forEach(function(p){if(p.id==tp)p.c=!p.c});save();return render()}
if(a=='selall'||a=='clrall'){S.packs.forEach(function(p){p.items.forEach(function(x){x.d=a=='selall'})});save();return render()}
if(a=='ck')return calcKey(b.dataset.k);if(a=='cswap'){CAL.sw=!CAL.sw;return calcDraw()}if(a=='ctog'){CAL.open=!CAL.open;return calcDraw()}
if(a=='fab')return tab=='trip'?itinSheet():expSheet();
if(a=='close')return shut();
if(a=='tdate'){S.td=b.dataset.d;save();return render()}
if(a=='ft'){S.ft=b.dataset.v;save();return render()}
if(a=='flt'){S.f=b.dataset.d;save();return render()}
if(a=='edit'){var x=find(k,id);return k=='i'?itinSheet(x):expSheet(x)}
if(a=='del'){if(k=='i')S.items=S.items.filter(function(x){return x.id!=id});else if(k=='e')S.exp=S.exp.filter(function(x){return x.id!=id});else if(k=='t')S.todos=S.todos.filter(function(x){return x.id!=id});else S.packs.forEach(function(p){p.items=p.items.filter(function(x){return x.id!=id})});save();return render()}
if(a=='tog'){S.todos.forEach(function(x){if(x.id==id)x.d=!x.d});S.packs.forEach(function(p){p.items.forEach(function(x){if(x.id==id)x.d=!x.d})});save();return render()}
if(a=='editpack'){var pid=b.closest('[data-p]').dataset.p,pk=S.packs.filter(function(p){return p.id==pid})[0];return sheet('編輯行李種類',fd('種類名稱','n',pk.name,'required'),function(f){pk.name=f.get('n').trim()||pk.name;save();render()},pid)}
if(a=='delpack'){if(!b.dataset.c){b.dataset.c='1';b.textContent='再按一次確認刪除';return}S.packs=S.packs.filter(function(p){return p.id!=b.dataset.p});save();shut();render();return}
if(a=='additem'){var c=b.closest('[data-p]');return addItem(c.dataset.p,c.querySelector('[data-a=newitem]'))}
if(a=='addtodo')return addTodo(b.previousElementSibling);if(a=='newpack')return sheet('新增行李種類',fd('種類名稱','n','','required placeholder="例如 衣物"'),function(f){S.packs.push({id:uid(),name:f.get('n').trim(),items:[]});save();render()})});
function addItem(pid,inp){var v=inp.value.trim();if(!v)return;S.packs.forEach(function(p){if(p.id==pid)p.items.push({id:uid(),t:v,d:false})});save();render();var i=document.querySelector('[data-p="'+pid+'"] [data-a=newitem]');if(i)i.focus()}
function addTodo(i){var v=i.value.trim();if(!v)return;S.todos.push({id:uid(),t:v,d:false});save();render();var n=document.querySelector('[data-a=newtodo]');if(n)n.focus()}
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.s){S.stay[t.dataset.s]=t.value;save()}else if(t.dataset.a=='rate'){S.rate=Math.max(0,parseFloat(t.value)||0);save();render()}else if(t.dataset.a=='ren'){var id=t.closest('.sw').dataset.id;S.todos.forEach(function(x){if(x.id==id)x.t=t.value.trim()||x.t});S.packs.forEach(function(p){p.items.forEach(function(x){if(x.id==id)x.t=t.value.trim()||x.t})});save();render()}});
document.addEventListener('keydown',function(e){if(e.key=='Enter'&&e.target.dataset.a=='newtodo')addTodo(e.target);if(e.key=='Enter'&&e.target.dataset.a=='newitem')addItem(e.target.closest('[data-p]').dataset.p,e.target);if(e.key=='Enter'&&e.target.dataset.a=='ren')e.target.blur()});
document.addEventListener('contextmenu',function(e){if(e.target.closest('.sw'))e.preventDefault()});
/* swipe + long press drag */
var g=null;
function reset(sw,open){sw.classList.toggle('open',open);sw.classList.remove('swp');var f=sw.querySelector('.face');f.style.transition='';f.style.transform=''}
$('#app').addEventListener('pointerdown',function(e){var sw=e.target.closest('.sw');if(!sw||e.target.closest('.acts')||(e.pointerType=='mouse'&&e.button))return;document.querySelectorAll('.sw.open').forEach(function(o){if(o!=sw)reset(o,false)});
g={sw:sw,f:sw.querySelector('.face'),x:e.clientX,y:e.clientY,base:sw.classList.contains('open')?-W:0,m:''};
if(sw.dataset.k=='i'||sw.dataset.k=='p')g.t=setTimeout(function(){if(g&&!g.m){g.m='drag';sw.classList.add('drag');if(navigator.vibrate)navigator.vibrate(15);var all=[].slice.call(sw.parentNode.children).filter(function(c){return c.classList.contains('sw')});g.d=all.indexOf(sw);g.n=g.d;g.h=sw.offsetHeight+(parseFloat(getComputedStyle(sw).marginBottom)||0);g.sibs=all.filter(function(c){return c!=sw});g.sibs.forEach(function(o){var q=o.getBoundingClientRect();o._c=q.top+q.height/2+scrollY;o.style.transition='transform .2s ease'})}},500)});
window.addEventListener('pointermove',function(e){if(!g)return;var dx=e.clientX-g.x,dy=e.clientY-g.y;
if(!g.m&&(Math.abs(dx)>8||Math.abs(dy)>8)){clearTimeout(g.t);if(Math.abs(dx)>Math.abs(dy)){g.m='swipe';g.f.style.transition='none';g.sw.classList.add('swp')}else{g=null;return}}
if(g.m=='swipe')g.f.style.transform='translateX('+Math.max(-W,Math.min(0,g.base+dx))+'px)';
if(g.m=='drag'){g.sw.style.transform='translateY('+dy+'px) scale(1.02)';var r=g.sw.getBoundingClientRect(),c=r.top+r.height/2+scrollY,n=0;g.sibs.forEach(function(o){if(o._c<c)n++});g.n=n;g.sibs.forEach(function(o,j){var t=0;if(j<g.d&&j>=n)t=g.h;else if(j>=g.d&&j<n)t=-g.h;o.style.transform=t?'translateY('+t+'px)':''})}});
document.addEventListener('touchmove',function(e){if(g&&g.m=='drag')e.preventDefault()},{passive:false});
function end(cancel){if(!g)return;clearTimeout(g.t);var sw=g.sw;
if(g.m=='swipe'){var m=new DOMMatrix(getComputedStyle(g.f).transform).m41;reset(sw,!cancel&&m<-W/2)}
else if(g.m=='drag'){var id=sw.dataset.id,k=sw.dataset.k,box=sw.parentNode,n=g.n;
sw.style.transform='';sw.classList.remove('drag');if(!cancel){if(k=='i'){var gd=box.dataset.d,it=S.items.filter(function(x){return x.id==id})[0],grp=S.items.filter(function(x){return dd(x)==gd&&x.id!=id});grp.splice(n,0,it);S.items=DATES.reduce(function(a,d){return a.concat(d==gd?grp:S.items.filter(function(x){return dd(x)==d}))},[])}else{S.packs.forEach(function(p){if(p.id==box.dataset.p){var m=p.items.filter(function(x){return x.id==id})[0];p.items=p.items.filter(function(x){return x.id!=id});p.items.splice(n,0,m)}})}save()}render()}
else if(!cancel&&sw.classList.contains('open')&&!e_btn)reset(sw,false);
g=null}
var e_btn=false;
window.addEventListener('pointerup',function(e){e_btn=!!e.target.closest('.acts');end(false)});
window.addEventListener('pointercancel',function(){end(true)});
render();
</script>
